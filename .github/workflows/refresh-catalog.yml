name: Refresh catalog

# Weekly regeneration of manga.json / anime.json from AniList,
# consumed by the AniSwipe app (lib/mediaCache.js).
on:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch catalog from AniList
        run: node fetch-anilist.js
        env:
          OUTPUT_DIR: .
          TARGET: 5000

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manga.json anime.json
          if git diff --staged --quiet; then
            echo "Catalog unchanged"
            exit 0
          fi
          git commit -m "Refresh catalog $(date -u +%F)"
          git push
