name: Refresh catalog

# Weekly regeneration of manga.json / anime.json from AniList, with French
# synopses translated by a free open-source model (Opus-MT) on the runner.
# Consumed by the Kinetic app.
on:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:
  # Also run when the pipeline itself changes (the bot's own data commits
  # don't touch these paths, so this can't loop)
  push:
    branches: [main]
    paths:
      - translate_fr.py
      - requirements.txt
      - .github/workflows/refresh-catalog.yml

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # translate_fr.py stops after MAX_MINUTES and saves its progress: the
    # first full translation may take a few runs, later ones only minutes
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install translation model runtime (CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache the translation model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opus-mt-en-fr

      - name: Fetch catalog from AniList
        run: node fetch-anilist.js
        env:
          OUTPUT_DIR: .
          TARGET: 5000

      # Free and local: no API key. If it fails, the commit step still runs
      # (the catalog is written with the translations already cached)
      - name: Translate synopses to French
        run: python translate_fr.py
        continue-on-error: true
        env:
          MAX_MINUTES: '300'

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manga.json anime.json translations_fr.json
          if git diff --staged --quiet; then
            echo "Catalog unchanged"
            exit 0
          fi
          git commit -m "Refresh catalog $(date -u +%F)"
          git push
